<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Stylizer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d2a27;
      background: #f3f6f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(640px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    h1 {
      margin: 0 0 8px;
    }

    p {
      margin: 0 0 20px;
      color: #4b5d58;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    input[type="file"] {
      flex: 1 1 100%;
      max-width: 100%;
    }

    button,
    #download {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    #stylize,
    #download {
      background: #0f6b5c;
      color: #fff;
    }

    #cancel {
      background: #dfe7e4;
      color: #1d2a27;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    progress {
      width: 100%;
      height: 12px;
    }

    #status {
      min-height: 1.5em;
      margin: 8px 0 16px;
    }

    #preview {
      display: block;
      max-width: 100%;
      border-radius: 8px;
      background: #dfe7e4;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>Video Stylizer</h1>
    <p>Upload or record a short video. Skin and hair turn red, clothes turn blue, and the background becomes a beach. Everything runs locally in your browser — nothing is uploaded.</p>

    <div class="controls">
      <input id="video-file" type="file" accept="video/*" aria-label="Video file">
      <button id="stylize" type="button" disabled>Stylize</button>
      <button id="cancel" type="button" disabled>Cancel</button>
      <a id="download" href="#" hidden>Download again</a>
    </div>

    <progress id="progress" max="1" value="0"></progress>
    <div id="status" role="status" aria-live="polite">Choose or record a video to begin.</div>
    <p id="browser-note" hidden></p>
    <canvas id="preview" width="480" height="270" aria-label="Stylized preview"></canvas>
  </main>
  <script type="module" src="./video-style.js"></script>
</body>
</html>
